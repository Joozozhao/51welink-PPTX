<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600">
  <defs>
    <radialGradient id="gB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4A8BF5" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#4A8BF5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gR" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F02D4E" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#F02D4E" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 氛围光 -->
  <ellipse cx="270" cy="300" rx="280" ry="250" fill="url(#gB)"/>
  <ellipse cx="270" cy="290" rx="190" ry="190" fill="url(#gR)"/>

  <!-- 轨道环 -->
  <g fill="none">
    <ellipse cx="300" cy="330" rx="272" ry="82" transform="rotate(-14 300 330)" stroke="#6FA3FF" stroke-opacity="0.55" stroke-width="2.5" stroke-dasharray="9 8"/>
    <ellipse cx="300" cy="330" rx="205" ry="60" transform="rotate(-14 300 330)" stroke="#F02D4E" stroke-opacity="0.45" stroke-width="2"/>
  </g>

  <!-- 点阵 -->
  <g fill="#6FA3FF" opacity="0.5">
    <circle cx="80" cy="120" r="3"/><circle cx="540" cy="160" r="3"/><circle cx="70" cy="460" r="3"/>
    <circle cx="520" cy="520" r="2.5"/><circle cx="120" cy="540" r="2.5"/><circle cx="555" cy="380" r="3"/>
  </g>

  <!-- 盾牌（私有化安全） -->
  <g>
    <path d="M268,120 L382,170 L382,310 Q382,420 268,480 Q154,420 154,310 L154,170 Z"
          fill="rgba(240,45,78,0.12)" stroke="#FF5C78" stroke-width="4"/>
    <path d="M268,158 L350,196 L350,308 Q350,392 268,442 Q186,392 186,308 L186,196 Z"
          fill="rgba(240,45,78,0.06)" stroke="#FF5C78" stroke-opacity="0.5" stroke-width="2"/>
    <polyline points="218,300 258,344 326,240" fill="none" stroke="#FF5C78" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- 闪电（高性能） -->
  <g>
    <path d="M470,140 L398,296 L452,296 L398,452 L512,244 L454,244 Z"
          fill="rgba(110,160,255,0.18)" stroke="#6FA3FF" stroke-width="3.5" stroke-linejoin="round"/>
  </g>

  <!-- 上升箭头（提升） -->
  <g fill="none">
    <polyline points="120,540 200,490 260,515 340,450 420,480 500,400"
              stroke="#6FA3FF" stroke-opacity="0.85" stroke-width="3" stroke-dasharray="2 9" stroke-linecap="round"/>
    <polygon points="500,400 474,404 494,428" fill="#6FA3FF"/>
  </g>
  <g fill="#F02D4E">
    <circle cx="200" cy="490" r="5"/><circle cx="340" cy="450" r="5"/>
  </g>
  <g fill="#6FA3FF">
    <circle cx="120" cy="540" r="5"/><circle cx="260" cy="515" r="5"/><circle cx="420" cy="480" r="5"/>
  </g>

  <!-- 仪表盘小弧（稳定性） -->
  <g fill="none">
    <path d="M470,540 A58,58 0 0 1 555,462" stroke="#6FA3FF" stroke-opacity="0.6" stroke-width="3" stroke-dasharray="6 7" stroke-linecap="round"/>
    <circle cx="555" cy="462" r="5" fill="#6FA3FF"/>
  </g>

  <!-- 漂浮粒子 -->
  <g>
    <circle cx="130" cy="220" r="4" fill="#F02D4E" opacity="0.8"/>
    <circle cx="430" cy="120" r="4.5" fill="#6FA3FF" opacity="0.8"/>
    <circle cx="90" cy="380" r="4" fill="#6FA3FF" opacity="0.6"/>
    <circle cx="480" cy="540" r="4.5" fill="#F02D4E" opacity="0.7"/>
  </g>
</svg>
