<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600">
  <defs>
    <radialGradient id="gB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4A8BF5" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#4A8BF5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gR" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F02D4E" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#F02D4E" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 氛围光 -->
  <ellipse cx="300" cy="320" rx="280" ry="250" fill="url(#gB)"/>
  <ellipse cx="480" cy="470" rx="150" ry="130" fill="url(#gR)"/>

  <!-- 轨道环 -->
  <g fill="none">
    <ellipse cx="300" cy="330" rx="272" ry="80" transform="rotate(-14 300 330)" stroke="#6FA3FF" stroke-opacity="0.5" stroke-width="2.5" stroke-dasharray="9 8"/>
    <ellipse cx="300" cy="330" rx="205" ry="58" transform="rotate(-14 300 330)" stroke="#F02D4E" stroke-opacity="0.4" stroke-width="2"/>
  </g>

  <!-- 控制台窗口 -->
  <g>
    <rect x="100" y="140" width="400" height="330" rx="16" fill="rgba(80,130,235,0.13)" stroke="#6FA3FF" stroke-width="3"/>
    <line x1="100" y1="182" x2="500" y2="182" stroke="#6FA3FF" stroke-opacity="0.55" stroke-width="2"/>
    <circle cx="126" cy="161" r="6" fill="#F02D4E"/>
    <circle cx="148" cy="161" r="6" fill="#6FA3FF"/>
    <circle cx="170" cy="161" r="6" fill="rgba(255,255,255,0.4)"/>
    <rect x="380" y="152" width="100" height="17" rx="8.5" fill="rgba(110,160,255,0.15)" stroke="#6FA3FF" stroke-opacity="0.5" stroke-width="1.5"/>
    <circle cx="392" cy="160" r="3" fill="#6FA3FF"/>
    <line x1="398" y1="160" x2="468" y2="160" stroke="#8FB4FF" stroke-width="4" stroke-linecap="round" opacity="0.6"/>

    <!-- 左侧导航 -->
    <g>
      <rect x="118" y="200" width="72" height="252" rx="10" fill="rgba(110,160,255,0.10)" stroke="#6FA3FF" stroke-opacity="0.4" stroke-width="1.5"/>
      <rect x="130" y="214" width="48" height="12" rx="6" fill="#6FA3FF" opacity="0.85"/>
      <rect x="130" y="240" width="48" height="12" rx="6" fill="rgba(143,180,255,0.4)"/>
      <rect x="130" y="266" width="48" height="12" rx="6" fill="rgba(143,180,255,0.4)"/>
      <rect x="130" y="292" width="48" height="12" rx="6" fill="rgba(143,180,255,0.4)"/>
      <rect x="130" y="318" width="48" height="12" rx="6" fill="rgba(143,180,255,0.4)"/>
    </g>

    <!-- 统计小卡 ×3 -->
    <g fill="rgba(110,160,255,0.12)" stroke="#6FA3FF" stroke-opacity="0.5" stroke-width="1.5">
      <rect x="206" y="200" width="88" height="58" rx="9"/>
      <rect x="304" y="200" width="88" height="58" rx="9"/>
      <rect x="402" y="200" width="80" height="58" rx="9"/>
    </g>
    <g fill="#8FB4FF">
      <rect x="218" y="216" width="40" height="9" rx="4.5"/>
      <rect x="218" y="234" width="56" height="6" rx="3" opacity="0.55"/>
      <rect x="316" y="216" width="40" height="9" rx="4.5"/>
      <rect x="316" y="234" width="56" height="6" rx="3" opacity="0.55"/>
      <rect x="414" y="216" width="36" height="9" rx="4.5" fill="#FF5C78"/>
      <rect x="414" y="234" width="52" height="6" rx="3" opacity="0.55"/>
    </g>

    <!-- 柱状图 -->
    <g>
      <rect x="206" y="276" width="186" height="120" rx="9" fill="rgba(110,160,255,0.10)" stroke="#6FA3FF" stroke-opacity="0.4" stroke-width="1.5"/>
      <g fill="#6FA3FF">
        <rect x="228" y="344" width="16" height="36" rx="3"/>
        <rect x="256" y="324" width="16" height="56" rx="3"/>
        <rect x="284" y="352" width="16" height="28" rx="3"/>
        <rect x="312" y="308" width="16" height="72" rx="3"/>
      </g>
      <rect x="340" y="332" width="16" height="48" rx="3" fill="#F02D4E"/>
      <polyline points="224,330 256,318 288,336 320,300 352,318" fill="none" stroke="#FF5C78" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- 消息列表 -->
    <g>
      <g fill="rgba(110,160,255,0.10)" stroke="#6FA3FF" stroke-opacity="0.35" stroke-width="1.2">
        <rect x="402" y="276" width="80" height="34" rx="7"/>
        <rect x="402" y="320" width="80" height="34" rx="7"/>
        <rect x="402" y="364" width="80" height="34" rx="7"/>
      </g>
      <circle cx="416" cy="293" r="4" fill="#6FA3FF"/><rect x="426" y="289" width="44" height="7" rx="3.5" fill="#8FB4FF" opacity="0.7"/>
      <circle cx="416" cy="337" r="4" fill="#F02D4E"/><rect x="426" y="333" width="44" height="7" rx="3.5" fill="#8FB4FF" opacity="0.7"/>
      <circle cx="416" cy="381" r="4" fill="#6FA3FF"/><rect x="426" y="377" width="44" height="7" rx="3.5" fill="#8FB4FF" opacity="0.7"/>
    </g>

    <!-- 底部进度条 -->
    <g>
      <rect x="206" y="416" width="276" height="14" rx="7" fill="rgba(110,160,255,0.12)" stroke="#6FA3FF" stroke-opacity="0.4" stroke-width="1.2"/>
      <rect x="206" y="416" width="196" height="14" rx="7" fill="#4A8BF5" opacity="0.8"/>
      <circle cx="402" cy="423" r="9" fill="#F02D4E"/>
    </g>
  </g>

  <!-- 浮动开关卡（右上，压在窗口角上） -->
  <g>
    <rect x="410" y="92" width="130" height="66" rx="14" fill="rgba(110,160,255,0.18)" stroke="#6FA3FF" stroke-width="2.5"/>
    <rect x="426" y="112" width="44" height="24" rx="12" fill="#4A8BF5"/>
    <circle cx="458" cy="124" r="9" fill="#fff"/>
    <rect x="482" y="118" width="44" height="12" rx="6" fill="#8FB4FF" opacity="0.7"/>
  </g>

  <!-- 浮动环形图卡（左下） -->
  <g>
    <rect x="70" y="420" width="150" height="110" rx="14" fill="rgba(80,130,235,0.16)" stroke="#6FA3FF" stroke-width="2.5"/>
    <circle cx="112" cy="475" r="26" fill="none" stroke="rgba(110,160,255,0.25)" stroke-width="9"/>
    <circle cx="112" cy="475" r="26" fill="none" stroke="#F02D4E" stroke-width="9" stroke-linecap="round" stroke-dasharray="163" stroke-dashoffset="49" transform="rotate(-90 112 475)"/>
    <rect x="152" y="446" width="52" height="9" rx="4.5" fill="#8FB4FF"/>
    <rect x="152" y="466" width="40" height="7" rx="3.5" fill="#8FB4FF" opacity="0.55"/>
    <rect x="152" y="484" width="46" height="7" rx="3.5" fill="#8FB4FF" opacity="0.55"/>
  </g>

  <!-- 点阵与粒子 -->
  <g fill="#6FA3FF" opacity="0.5">
    <circle cx="60" cy="120" r="3"/><circle cx="545" cy="230" r="3"/><circle cx="70" cy="330" r="2.5"/>
    <circle cx="540" cy="380" r="3"/><circle cx="260" cy="540" r="2.5"/><circle cx="420" cy="560" r="3"/>
  </g>
  <circle cx="560" cy="120" r="4.5" fill="#F02D4E" opacity="0.8"/>
  <circle cx="50" cy="220" r="4" fill="#6FA3FF" opacity="0.7"/>
</svg>
