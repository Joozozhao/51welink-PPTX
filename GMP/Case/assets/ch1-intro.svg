    <path d="M133,248 a13,13 0 0 1 26,0 l5,12 h-36 z" fill="none" stroke="#F02D4E" stroke-width="3" stroke-linejoin="round"/>
    <circle cx="146" cy="266" r="3.5" fill="#F02D4E"/>
  </g>

  <!-- 漂浮粒子 -->
  <g>
    <circle cx="160" cy="350" r="4" fill="#6FA3FF" opacity="0.8"/>
    <circle cx="470" cy="330" r="4" fill="#F02D4E" opacity="0.8"/>
    <circle cx="500" cy="480" r="4.5" fill="#6FA3FF" opacity="0.7"/>
    <circle cx="120" cy="450" r="4.5" fill="#6FA3FF" opacity="0.6"/>
