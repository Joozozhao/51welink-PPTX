    <rect x="208" y="272" width="184" height="11" rx="5.5" fill="#4A8BF5" opacity="0.75"/>
    <g fill="rgba(110,160,255,0.14)" stroke="#6FA3FF" stroke-opacity="0.6" stroke-width="1.5">
