<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600">
  <defs>
    <radialGradient id="gB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4A8BF5" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#4A8BF5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gR" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F02D4E" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#F02D4E" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 氛围光 -->
  <ellipse cx="300" cy="340" rx="270" ry="250" fill="url(#gB)"/>
  <ellipse cx="470" cy="140" rx="150" ry="130" fill="url(#gR)"/>

  <!-- 轨道环 -->
  <g fill="none">
    <ellipse cx="300" cy="360" rx="272" ry="80" transform="rotate(-14 300 360)" stroke="#6FA3FF" stroke-opacity="0.55" stroke-width="2.5" stroke-dasharray="9 8"/>
    <ellipse cx="300" cy="360" rx="205" ry="58" transform="rotate(-14 300 360)" stroke="#F02D4E" stroke-opacity="0.45" stroke-width="2"/>
  </g>

  <!-- 点阵 -->
  <g fill="#6FA3FF" opacity="0.5">
    <circle cx="80" cy="150" r="3"/><circle cx="120" cy="110" r="2.5"/><circle cx="70" cy="420" r="3"/>
    <circle cx="530" cy="430" r="3"/><circle cx="550" cy="240" r="2.5"/><circle cx="90" cy="520" r="2.5"/>
    <circle cx="490" cy="540" r="3"/><circle cx="200" cy="80" r="2.5"/>
