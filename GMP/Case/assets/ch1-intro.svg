    <polygon points="354,174 354,200 382,174" fill="rgba(110,160,255,0.14)" stroke="#6FA3FF" stroke-width="3"/>
    <circle cx="370" cy="137" r="6.5" fill="#6FA3FF"/>
    <circle cx="405" cy="137" r="6.5" fill="#F02D4E"/>
    <circle cx="440" cy="137" r="6.5" fill="#6FA3FF"/>
  </g>

  <!-- 邮件气泡 -->
  <g>
    <rect x="98" y="80" width="128" height="86" rx="13" fill="rgba(110,160,255,0.14)" stroke="#6FA3FF" stroke-width="3"/>
    <polyline points="104,94 162,136 220,94" fill="none" stroke="#6FA3FF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
