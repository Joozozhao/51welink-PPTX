      <rect x="226" y="360" width="148" height="46" rx="7"/>
      <rect x="226" y="420" width="148" height="46" rx="7"/>
      <rect x="226" y="480" width="148" height="46" rx="7"/>
    </g>
    <g fill="#8FB4FF">
      <rect x="240" y="314" width="72" height="6" rx="3"/><rect x="240" y="328" width="50" height="6" rx="3"/>
      <rect x="240" y="374" width="72" height="6" rx="3"/><rect x="240" y="388" width="50" height="6" rx="3"/>
      <rect x="240" y="434" width="72" height="6" rx="3"/><rect x="240" y="448" width="50" height="6" rx="3"/>
      <rect x="240" y="494" width="72" height="6" rx="3"/><rect x="240" y="508" width="50" height="6" rx="3"/>
    </g>
    <g>
      <circle cx="352" cy="323" r="4.5" fill="#6FA3FF"/><circle cx="352" cy="323" r="9" fill="#6FA3FF" opacity="0.35"/>
      <circle cx="352" cy="383" r="4.5" fill="#6FA3FF"/><circle cx="352" cy="383" r="9" fill="#6FA3FF" opacity="0.35"/>
      <circle cx="352" cy="443" r="4.5" fill="#F02D4E"/><circle cx="352" cy="443" r="9" fill="#F02D4E" opacity="0.35"/>
      <circle cx="352" cy="503" r="4.5" fill="#6FA3FF"/><circle cx="352" cy="503" r="9" fill="#6FA3FF" opacity="0.35"/>
    </g>
  </g>

  <!-- 上升虚线轨迹 -->
  <g fill="none" stroke="#6FA3FF" stroke-opacity="0.7" stroke-width="2.5" stroke-dasharray="3 8" stroke-linecap="round">
    <path d="M330,268 C330,240 340,226 352,212"/>
    <path d="M262,268 C250,240 236,226 224,214"/>
    <path d="M392,300 C420,280 434,268 444,254"/>
