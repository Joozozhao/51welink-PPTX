<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 250">
  <defs>
    <radialGradient id="gB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4A8BF5" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#4A8BF5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gR" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F02D4E" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#F02D4E" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 氛围光 -->
  <ellipse cx="300" cy="150" rx="290" ry="140" fill="url(#gB)"/>
  <ellipse cx="440" cy="80" rx="130" ry="90" fill="url(#gR)"/>

  <!-- 客户网络连线（建筑上方） -->
  <g stroke="#6FA3FF" stroke-opacity="0.65" stroke-width="2" fill="none" stroke-dasharray="4 6" stroke-linecap="round">
    <polyline points="90,110 190,66 300,96 420,58 510,100"/>
    <polyline points="190,66 300,96" stroke-dasharray="none"/>
    <polyline points="300,96 420,58" stroke-dasharray="none"/>
  </g>
  <g>
    <circle cx="90" cy="110" r="7" fill="#6FA3FF"/><circle cx="90" cy="110" r="13" fill="#6FA3FF" opacity="0.3"/>
    <circle cx="190" cy="66" r="7" fill="#F02D4E"/><circle cx="190" cy="66" r="13" fill="#F02D4E" opacity="0.3"/>
    <circle cx="300" cy="96" r="7" fill="#6FA3FF"/><circle cx="300" cy="96" r="13" fill="#6FA3FF" opacity="0.3"/>
    <circle cx="420" cy="58" r="7" fill="#6FA3FF"/><circle cx="420" cy="58" r="13" fill="#6FA3FF" opacity="0.3"/>
    <circle cx="510" cy="100" r="7" fill="#F02D4E"/><circle cx="510" cy="100" r="13" fill="#F02D4E" opacity="0.3"/>
  </g>

  <!-- 企业建筑群 -->
  <g>
    <line x1="30" y1="212" x2="570" y2="212" stroke="#6FA3FF" stroke-opacity="0.6" stroke-width="2.5"/>
    <!-- 楼 1 -->
    <rect x="60" y="130" width="86" height="82" rx="10" fill="rgba(80,130,235,0.16)" stroke="#6FA3FF" stroke-width="2.5"/>
    <!-- 楼 2（高） -->
    <rect x="170" y="92" width="96" height="120" rx="10" fill="rgba(80,130,235,0.20)" stroke="#6FA3FF" stroke-width="2.5"/>
    <rect x="196" y="72" width="44" height="22" rx="8" fill="rgba(80,130,235,0.20)" stroke="#6FA3FF" stroke-width="2.5"/>
    <!-- 楼 3（主楼，红色描边高亮） -->
    <rect x="290" y="112" width="110" height="100" rx="10" fill="rgba(240,45,78,0.10)" stroke="#FF5C78" stroke-width="3"/>
    <!-- 楼 4 -->
    <rect x="424" y="142" width="80" height="70" rx="10" fill="rgba(80,130,235,0.16)" stroke="#6FA3FF" stroke-width="2.5"/>
    <!-- 楼 5 -->
    <rect x="520" y="160" width="52" height="52" rx="10" fill="rgba(80,130,235,0.14)" stroke="#6FA3FF" stroke-width="2.5"/>
  </g>

  <!-- 窗户点阵 -->
  <g fill="#8FB4FF" opacity="0.85">
    <circle cx="82" cy="152" r="3.5"/><circle cx="104" cy="152" r="3.5"/><circle cx="126" cy="152" r="3.5"/>
    <circle cx="82" cy="176" r="3.5"/><circle cx="104" cy="176" r="3.5"/><circle cx="126" cy="176" r="3.5"/>
    <circle cx="196" cy="116" r="3.5"/><circle cx="220" cy="116" r="3.5"/><circle cx="244" cy="116" r="3.5"/>
    <circle cx="196" cy="142" r="3.5"/><circle cx="220" cy="142" r="3.5"/><circle cx="244" cy="142" r="3.5"/>
    <circle cx="196" cy="168" r="3.5"/><circle cx="220" cy="168" r="3.5"/><circle cx="244" cy="168" r="3.5"/>
    <circle cx="446" cy="162" r="3.5"/><circle cx="466" cy="162" r="3.5"/><circle cx="486" cy="162" r="3.5"/>
    <circle cx="446" cy="184" r="3.5"/><circle cx="466" cy="184" r="3.5"/><circle cx="486" cy="184" r="3.5"/>
    <circle cx="538" cy="176" r="3"/><circle cx="556" cy="176" r="3"/><circle cx="538" cy="194" r="3"/><circle cx="556" cy="194" r="3"/>
  </g>
  <g fill="#FF8CA0">
    <circle cx="316" cy="136" r="3.5"/><circle cx="344" cy="136" r="3.5"/><circle cx="372" cy="136" r="3.5"/>
    <circle cx="316" cy="162" r="3.5"/><circle cx="344" cy="162" r="3.5"/><circle cx="372" cy="162" r="3.5"/>
    <circle cx="316" cy="188" r="3.5"/><circle cx="344" cy="188" r="3.5"/><circle cx="372" cy="188" r="3.5"/>
  </g>

  <!-- 屋顶天线 / 信号灯 -->
  <g>
    <line x1="218" y1="72" x2="218" y2="52" stroke="#6FA3FF" stroke-width="2.5"/>
    <circle cx="218" cy="48" r="4" fill="#F02D4E"/>
    <circle cx="218" cy="48" r="9" fill="none" stroke="#F02D4E" stroke-opacity="0.5" stroke-width="1.5"/>
  </g>

  <!-- 漂浮粒子 -->
  <g>
    <circle cx="40" cy="70" r="3.5" fill="#6FA3FF" opacity="0.7"/>
    <circle cx="560" cy="50" r="3.5" fill="#F02D4E" opacity="0.7"/>
    <circle cx="250" cy="40" r="3" fill="#6FA3FF" opacity="0.6"/>
    <circle cx="150" cy="220" r="3" fill="#6FA3FF" opacity="0.6"/>
  </g>
</svg>
