
</main>
</div>

<!-- === 播放器 chrome（舞台之外） === -->
<div class="deck-progress" id="deckProgress" aria-hidden="true"><div class="deck-progress-bar" id="deckProgressBar"></div></div>
<div class="edit-hotzone" title="编辑模式 (E)"></div>
<button class="edit-toggle" id="editToggle" title="编辑模式 (E)">✏️</button>
<div class="dl-hotzone" title="下载资料"></div>
<div class="deck-download">
    <a href="Push.pdf" id="dlPdf" download>PDF</a>
    <a href="Push.pptx" id="dlPptx" download>PPTX</a>
    <a href="Push.zip" id="dlZip" download>ZIP</a>
</div>
<div class="edit-export" id="editExport" aria-label="导出修改后的文件">
    <button type="button" id="exportEditedHtml">下载修改后 HTML</button>
    <button type="button" id="exportEditedPdf">下载修改后 PDF</button>
</div>
<div class="edit-toast" id="editToast">已保存</div>

<script>
/* === SLIDE PRESENTATION CONTROLLER === */
class SlidePresentation {
    constructor() {
        this.slides = document.querySelectorAll('.slide');
        this.currentSlide = 0;
        this.stage = document.getElementById('deckStage');
        this.wheelLock = false;
        this.setupStageScale();
        this.setupKeyboardNav();
        this.setupTouchNav();
        this.setupWheelNav();
        this.showSlide(0);
    }
    setupStageScale() {
        const scale = () => {
            const factor = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
            const x = (window.innerWidth - 1920 * factor) / 2;
            const y = (window.innerHeight - 1080 * factor) / 2;
            this.stage.style.transform = `translate(${x}px, ${y}px) scale(${factor})`;
        };
        scale();
        window.addEventListener('resize', scale);
    }
    setupKeyboardNav() {
        document.addEventListener('keydown', (e) => {
            if (e.target.getAttribute('contenteditable') === 'true') return;
            if (['ArrowRight', 'ArrowDown', ' ', 'PageDown'].includes(e.key)) { e.preventDefault(); this.next(); }
            else if (['ArrowLeft', 'ArrowUp', 'PageUp'].includes(e.key)) { e.preventDefault(); this.prev(); }
            else if (e.key === 'Home') this.showSlide(0);
            else if (e.key === 'End') this.showSlide(this.slides.length - 1);
        });
    }
    setupTouchNav() {
        let sx = 0, sy = 0;
        document.addEventListener('touchstart', (e) => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive: true });
        document.addEventListener('touchend', (e) => {
            const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
            if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy)) (dx < 0 ? this.next() : this.prev());
        }, { passive: true });
    }
    setupWheelNav() {
        document.addEventListener('wheel', (e) => {
            if (this.wheelLock || Math.abs(e.deltaY) < 24) return;
            this.wheelLock = true;
            (e.deltaY > 0 ? this.next() : this.prev());
            setTimeout(() => this.wheelLock = false, 650);
        }, { passive: true });
    }
    next() { this.showSlide(this.currentSlide + 1); }
    prev() { this.showSlide(this.currentSlide - 1); }
    showSlide(index) {
        this.currentSlide = Math.max(0, Math.min(index, this.slides.length - 1));
        this.slides.forEach((s, i) => {
            s.classList.toggle('active', i === this.currentSlide);
            s.classList.toggle('visible', i === this.currentSlide);
        });
        const bar = document.getElementById('deckProgressBar');
        if (bar) bar.style.width = ((this.currentSlide + 1) / this.slides.length * 100) + '%';
    }
}

/* === INLINE EDITOR（独立存储；内容确有变化时显示修改后导出） === */
class InlineEditor {
    constructor() {
        this.isActive = false;
        this.current = null;
        this.toast = document.getElementById('editToast');
        this.exportPanel = document.getElementById('editExport');
        this.storagePrefix = 'wwt:Push:slide:';
        this.slides = [...document.querySelectorAll('.slide')];
        this.original = new Map(this.slides.map(s => [s.id, this.normalizedHtml(s)]));
        this.restore();
        this.updateChangeState();
        document.addEventListener('click', (e) => {
            if (!this.isActive) return;
            const el = e.target.closest('.slide *');
            if (el && el !== this.current) this.edit(el);
            else if (!el) this.stop();
        }, true);
        document.addEventListener('input', (e) => {
            if (e.target.closest('.slide')) this.updateChangeState();
        });
        document.addEventListener('keydown', (e) => {
            if ((e.ctrlKey || e.metaKey) && e.key === 's') { e.preventDefault(); this.saveAll(); }
            if (e.key === 'Escape' && this.isActive) this.toggleEditMode();
        });
        document.getElementById('exportEditedHtml').addEventListener('click', () => this.exportHtml());
        document.getElementById('exportEditedPdf').addEventListener('click', () => this.exportPdf());
    }
    normalizedHtml(slide) {
        const clone = slide.cloneNode(true);
        clone.classList.remove('active', 'visible');
        clone.querySelectorAll('[contenteditable]').forEach(el => el.removeAttribute('contenteditable'));
        return clone.innerHTML;
    }
    hasChanges() {
        return this.slides.some(s => this.normalizedHtml(s) !== this.original.get(s.id));
    }
    updateChangeState() {
        const changed = this.hasChanges();
        this.exportPanel.classList.toggle('has-changes', changed);
        this.exportPanel.setAttribute('aria-hidden', changed ? 'false' : 'true');
        return changed;
    }
    toggleEditMode() {
        this.isActive = !this.isActive;
        document.body.classList.toggle('editing', this.isActive);
        document.getElementById('editToggle').classList.toggle('active', this.isActive);
        if (!this.isActive) this.stop();
    }
    edit(el) {
        this.stop();
        let target = el;
        while (target.children.length && ![...target.childNodes].some(n => n.nodeType === 3 && n.textContent.trim())) target = target.children[0];
        if (![...target.childNodes].some(n => n.nodeType === 3 && n.textContent.trim())) return;
        this.current = target;
        target.contentEditable = 'true';
        target.focus();
        target.addEventListener('blur', () => { this.saveAll(); }, { once: true });
    }
    stop() {
        if (this.current) { this.current.contentEditable = 'false'; this.current = null; }
        this.updateChangeState();
    }
    saveAll(showToast = true) {
        this.stop();
        this.slides.forEach(s => {
            const key = this.storagePrefix + s.id;
            try {
                if (this.normalizedHtml(s) === this.original.get(s.id)) localStorage.removeItem(key);
                else localStorage.setItem(key, s.innerHTML);
            } catch (e) {}
        });
        this.updateChangeState();
        if (showToast) {
            this.toast.textContent = '已保存';
            this.toast.classList.add('show');
            clearTimeout(this._tt);
            this._tt = setTimeout(() => this.toast.classList.remove('show'), 1200);
        }
    }
    restore() {
        this.slides.forEach(s => {
            const saved = localStorage.getItem(this.storagePrefix + s.id);
            if (saved) s.innerHTML = saved;
        });
    }
    filename(ext) {
        const title = document.title.replace(/\s*[·•]\s*/g, '').replace(/\s+/g, '').trim();
        const d = new Date();
        const date = `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`;
        return `${title}_${date}.${ext}`;
    }
    downloadBlob(blob, name) {
        const url = URL.createObjectURL(blob), a = document.createElement('a');
        a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1500);
    }
    async dataUrl(url) {
        const blob = await fetch(url).then(r => { if (!r.ok) throw new Error(url); return r.blob(); });
        return await new Promise((resolve, reject) => { const reader = new FileReader(); reader.onload = () => resolve(reader.result); reader.onerror = reject; reader.readAsDataURL(blob); });
    }
    async exportHtml() {
        this.saveAll(false);
        if (!this.hasChanges()) return;
        const button = document.getElementById('exportEditedHtml'), label = button.textContent;
        button.disabled = true; button.textContent = '正在打包…';
        try {
            const clone = document.documentElement.cloneNode(true);
            clone.querySelector('body').classList.remove('editing');
            clone.querySelectorAll('[contenteditable]').forEach(el => el.removeAttribute('contenteditable'));
            clone.querySelector('#editToggle')?.classList.remove('active', 'show');
            clone.querySelector('#editExport')?.classList.add('has-changes');
            const sourceImages = [...document.images], cloneImages = [...clone.querySelectorAll('img')], cache = new Map();
            for (let i = 0; i < sourceImages.length; i++) {
                const url = sourceImages[i].src;
                if (!cache.has(url)) cache.set(url, await this.dataUrl(url));
                cloneImages[i].src = cache.get(url);
            }
            this.downloadBlob(new Blob(['<!DOCTYPE html>\n' + clone.outerHTML], {type:'text/html;charset=utf-8'}), this.filename('html'));
            this.toast.textContent = '已下载修改后的 HTML'; this.toast.classList.add('show');
            clearTimeout(this._tt); this._tt = setTimeout(() => this.toast.classList.remove('show'), 1800);
        } catch (e) {
            console.error(e); this.toast.textContent = 'HTML 导出失败'; this.toast.classList.add('show');
        } finally { button.disabled = false; button.textContent = label; }
    }
    exportPdf() {
        this.saveAll(false);
        if (!this.hasChanges()) return;
        const oldTitle = document.title;
        document.title = this.filename('pdf').replace(/\.pdf$/, '');
        this.toast.textContent = '请在打印窗口中选择“另存为 PDF”'; this.toast.classList.add('show');
        const restore = () => { document.title = oldTitle; removeEventListener('afterprint', restore); };
        addEventListener('afterprint', restore);
        setTimeout(() => window.print(), 120);
    }
    exportFile() { this.exportHtml(); }
}

const deck = new SlidePresentation();
const editor = new InlineEditor();

/* 编辑开关：按钮点击 / 热区悬停(400ms 延迟) / 热区点击 / E 键 */
const hotzone = document.querySelector('.edit-hotzone');
const editToggle = document.getElementById('editToggle');
let hideTimeout = null;
editToggle.addEventListener('click', () => editor.toggleEditMode());

// 下载按钮：标题+日期命名
function getDownloadFilename(ext) {
    const title = document.title.replace(/\s*[·•]\s*/g, '').replace(/\s+/g, '').trim();
    const now = new Date();
    const date = now.getFullYear().toString() +
        (now.getMonth() + 1).toString().padStart(2, '0') +
        now.getDate().toString().padStart(2, '0');
    return title + '_' + date + '.' + ext;
}
document.getElementById('dlPdf').addEventListener('click', function(e) {
    this.setAttribute('download', getDownloadFilename('pdf'));
});
document.getElementById('dlPptx').addEventListener('click', function(e) {
    this.setAttribute('download', getDownloadFilename('pptx'));
});
document.getElementById('dlZip').addEventListener('click', function(e) {
    this.setAttribute('download', getDownloadFilename('zip'));
});
hotzone.addEventListener('mouseenter', () => { clearTimeout(hideTimeout); editToggle.classList.add('show'); });
hotzone.addEventListener('mouseleave', () => { hideTimeout = setTimeout(() => { if (!editor.isActive) editToggle.classList.remove('show'); }, 400); });
editToggle.addEventListener('mouseenter', () => clearTimeout(hideTimeout));
editToggle.addEventListener('mouseleave', () => { hideTimeout = setTimeout(() => { if (!editor.isActive) editToggle.classList.remove('show'); }, 400); });
hotzone.addEventListener('click', () => editor.toggleEditMode());
document.addEventListener('keydown', (e) => {
    if ((e.key === 'e' || e.key === 'E') && !e.target.getAttribute('contenteditable')) editor.toggleEditMode();
});
</script>
</body>
